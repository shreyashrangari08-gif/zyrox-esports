<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYROX eSports - Leaderboard & Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-amber-400">Tournament Leaderboard</h1>
                <p class="text-slate-400 text-sm">View Match Rankings, Scores & Submit Results</p>
            </div>
            <a href="player.html" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded font-semibold">Back to Player Portal</a>
        </header>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- Submit Result Card -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">Submit Match Score</h2>
                <form id="submitResultForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Tournament ID</label>
                        <input type="number" id="resTourneyId" required class="w-full p-2 rounded bg-slate-700 border border-slate-600" placeholder="e.g., 1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Your User ID</label>
                        <input type="number" id="resUserId" required class="w-full p-2 rounded bg-slate-700 border border-slate-600" placeholder="e.g., 1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Score / Kills</label>
                        <input type="number" id="resScore" required class="w-full p-2 rounded bg-slate-700 border border-slate-600" placeholder="e.g., 8">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold p-2 rounded transition">Submit Score</button>
                </form>
                <p id="resMsg" class="mt-3 text-sm text-center"></p>
            </div>

            <!-- View Leaderboard Card -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 flex flex-col">
                <h2 class="text-xl font-bold mb-4 text-cyan-400">Live Rankings</h2>
                <div class="space-y-3 mb-4">
                    <label class="block text-sm font-medium">Select Tournament ID to View Rank</label>
                    <div class="flex gap-2">
                        <input type="number" id="viewTourneyId" class="w-full p-2 rounded bg-slate-700 border border-slate-600" placeholder="Tournament ID">
                        <button onclick="fetchLeaderboard()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded font-bold text-sm">Load</button>
                    </div>
                </div>
                <div id="leaderboardList" class="space-y-2 overflow-y-auto max-h-60 flex-1">
                    <p class="text-slate-400 text-sm">Enter Tournament ID and click Load to see rankings.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Submit Score API
        document.getElementById("submitResultForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const tourneyId = document.getElementById("resTourneyId").value;
            const data = {
                user_id: parseInt(document.getElementById("resUserId").value),
                score: parseInt(document.getElementById("resScore").value)
            };

            try {
                const response = await fetch(`${API_URL}/tournaments/${tourneyId}/submit-result`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if(response.ok) {
                    document.getElementById("resMsgপ্রিল").innerText = result.message;
                    document.getElementById("resMsg").className = "mt-3 text-sm text-center text-emerald-400 font-semibold";
                } else {
                    throw new Error(result.detail || "Submission failed");
                }
            } catch (err) {
                document.getElementById("resMsg").innerText = `Error: ${err.message}`;
                document.getElementById("resMsg").className = "mt-3 text-sm text-center text-red-400 font-semibold";
            }
        });

        // Fetch Leaderboard API
        async function fetchLeaderboard() {
            const tourneyId = document.getElementById("viewTourneyId").value;
            if (!tourneyId) {
                alert("Please enter a Tournament ID!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/tournaments/${tourneyId}/leaderboard`);
                const ranks = await response.json();
                const container = document.getElementById("leaderboardList");

                if (ranks.length === 0) {
                    container.innerHTML = `<p class="text-slate-400 text-sm">No scores submitted yet for this tournament.</p>`;
                    return;
                }

                container.innerHTML = "";
                ranks.forEach((r, index) => {
                    container.innerHTML += `
                        <div class="bg-slate-700/60 p-3 rounded flex justify-between items-center border border-slate-600">
                            <div>
                                <span class="text-amber-400 font-bold mr-2">#${index + 1}</span>
                                <span class="font-semibold">${r.name}</span> 
                                <span class="text-xs text-slate-400">(${r.zrx_id})</span>
                            </div>
                            <div class="text-right">
                                <span class="text-emerald-400 font-bold">${r.score} pts</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById("leaderboardList").innerHTML = `<p class="text-red-400 text-sm">Failed to load leaderboard.</p>`;
            }
        }
    </script>
</body>
</html>
